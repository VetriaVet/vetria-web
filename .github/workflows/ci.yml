# CI da Vetria — T-003. Ver docs/03-TAREFAS.md e R-003.
#
# Roda em push na `main` e em todo pull request. Faz o que a regra do projeto
# já exigia de quem commitava à mão ("build verde antes de qualquer push"),
# só que sem depender de ninguém lembrar.
#
# ⚠️ SEGREDOS — o que entra aqui e o que NUNCA entra:
#   ENTRA  NEXT_PUBLIC_SUPABASE_URL       público por desenho (viaja no bundle)
#   ENTRA  NEXT_PUBLIC_SUPABASE_ANON_KEY  público por desenho (protegido por RLS)
#   ENTRA  E2E_VET_EMAIL / E2E_VET_SENHA  conta de teste, criada à mão, role vet
#   NUNCA  SUPABASE_SERVICE_ROLE_KEY      ignora RLS inteira. Workflow
#          comprometido com ela na mão lê a base de todo mundo. Se algum dia
#          um teste "precisar" dela, o teste está errado, não o workflow.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# DL-064 (T-029): o CI inteiro aponta para o projeto de TESTE (vetria-e2e).
#   ENTRA  TESTE_SUPABASE_URL / TESTE_SUPABASE_ANON_KEY   do vetria-e2e
#   ENTRA  TESTE_SUPABASE_SERVICE_ROLE_KEY  a do vetria-e2e, so no passo E2E
#   ENTRA  TESTE_{VET,TUTOR,ADMIN,CLINIC}_{EMAIL,SENHA}  contas fixas do vetria-e2e
#   NUNCA  a service_role de PRODUCAO. Nem aqui, nem em secret nenhum do repo.
#          tests/apoio/alvo.ts e o pre-voo abaixo recusam URL de producao.
concurrency:
  group: ci-vetria-e2e        # um banco de teste para todos os branches
  cancel-in-progress: false

jobs:
  ci:
    name: build + lint + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TESTE_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TESTE_SUPABASE_ANON_KEY }}
      E2E_VET_EMAIL: ${{ secrets.TESTE_VET_EMAIL }}
      E2E_VET_SENHA: ${{ secrets.TESTE_VET_SENHA }}
      E2E_TUTOR_EMAIL: ${{ secrets.TESTE_TUTOR_EMAIL }}
      E2E_TUTOR_SENHA: ${{ secrets.TESTE_TUTOR_SENHA }}
      E2E_ADMIN_EMAIL: ${{ secrets.TESTE_ADMIN_EMAIL }}
      E2E_ADMIN_SENHA: ${{ secrets.TESTE_ADMIN_SENHA }}
      E2E_CLINIC_EMAIL: ${{ secrets.TESTE_CLINIC_EMAIL }}
      E2E_CLINIC_SENHA: ${{ secrets.TESTE_CLINIC_SENHA }}
      E2E_ALVO: teste
      E2E_EXIGIR_FILA: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Guarda contra o pior modo de falha deste workflow: rodar sem as duas
      # chaves públicas e ficar verde à toa. Sem elas o `middleware.ts` estoura
      # em toda rota e a suíte inteira falharia com 500 — melhor parar aqui,
      # com o motivo escrito, do que depurar 500 no relatório do Playwright.
      - name: Conferir que o alvo e o projeto de TESTE e que nenhum secret falta
        env:
          SERVICE_KEY: ${{ secrets.TESTE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          falta=""
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SERVICE_KEY                    E2E_VET_EMAIL E2E_VET_SENHA E2E_TUTOR_EMAIL E2E_TUTOR_SENHA                    E2E_ADMIN_EMAIL E2E_ADMIN_SENHA E2E_CLINIC_EMAIL E2E_CLINIC_SENHA; do
            [ -z "${!v}" ] && falta="$falta $v"
          done
          if [ -n "$falta" ]; then
            echo "::error::Faltam secrets do projeto de teste:$falta (Settings > Secrets > Actions, nomes TESTE_*)."
            echo "::error::Sem eles os testes pulariam; com E2E_EXIGIR_FILA=1 pulo e falha."
            exit 1
          fi
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::TESTE_SUPABASE_URL tem que ser a URL completa: https://<ref>.supabase.co"; exit 1;;
          esac
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            *gdqnnrozbxrtaaquarnd*) echo "::error::RECUSADO: TESTE_SUPABASE_URL e a de PRODUCAO (DL-064)."; exit 1;;
          esac
          echo "Alvo: projeto de teste. Secrets presentes."

      - name: Build
        run: npm run build

      # ✅ T-014 (31/08/2026) — este passo PASSOU A BLOQUEAR.
      # Nasceu com `continue-on-error: true` porque havia 14 erros e 3 avisos
      # anteriores, todos em arquivo de produção, e CI que nasce vermelho
      # ninguém olha depois. Os 17 foram zerados e a linha saiu.
      #
      # ⚠️ Quem for tentado a devolver o `continue-on-error` num dia de pressa:
      # o custo dele não é o erro que passa, é que o passo vira decoração e
      # ninguém mais lê a saída. Conserte o lint ou remova o passo, não o
      # transforme em enfeite.
      - name: Lint
        run: npm run lint

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E
        run: npx playwright test
        env:
          CI: "true"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TESTE_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Guardar o relatório quando algo falha
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
